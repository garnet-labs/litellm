name: Shadow dependency mirror

# SHADOW_MIRROR_TOKEN: a fine-grained PAT scoped to garnet-labs/litellm with
# Contents, Pull requests, Actions, and Workflows write access. A PAT is
# required for the generated push and pull_request events to trigger Actions.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      prs:
        description: Optional space-separated upstream PR numbers
        type: string
      dry_run:
        description: List eligible changes without writing to GitHub
        type: boolean
        default: false
      verdict_pr:
        description: Mirror PR number to publish a verdict on (leave blank to sync)
        type: string
      verdict:
        description: PASS or HOLD, as derived from Garnet pr_review
        type: string
      verdict_head:
        description: Full mirror head SHA evaluated by Garnet pr_review
        type: string
      verdict_body:
        description: Reason, changed rows if applicable, and App record link
        type: string
      verdict_session:
        description: Optional Devin session ID for attribution
        type: string

permissions:
  contents: read

concurrency:
  group: shadow-dependency-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'garnet-labs/litellm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            .github/scripts/shadow_mirror
            .github/workflows/garnet-record.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Test shadow mirror
        run: python3 -m unittest discover -s .github/scripts/shadow_mirror
      - name: Sync dependency changes or publish a gate verdict
        shell: bash
        env:
          SHADOW_MIRROR_TOKEN: ${{ secrets.SHADOW_MIRROR_TOKEN }}
          GH_TOKEN: ${{ inputs.dry_run && github.token || '' }}
          PRS: ${{ inputs.prs }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERDICT_PR: ${{ inputs.verdict_pr }}
          VERDICT: ${{ inputs.verdict }}
          VERDICT_HEAD: ${{ inputs.verdict_head }}
          VERDICT_BODY: ${{ inputs.verdict_body }}
          VERDICT_SESSION: ${{ inputs.verdict_session }}
        run: |
          set -euo pipefail
          if [[ -n "${VERDICT_PR}${VERDICT}${VERDICT_HEAD}${VERDICT_BODY}${VERDICT_SESSION}" ]]; then
            if [[ "$DRY_RUN" == true || -n "$PRS" ]]; then
              echo '::error::Verdict mode cannot be combined with sync inputs.'
              exit 1
            fi
            if [[ ! "$VERDICT_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::Verdict mode requires a positive integer mirror PR number.'
              exit 1
            fi
            python3 .github/scripts/shadow_mirror/mirror.py verdict \
              --pr="$VERDICT_PR" --head="$VERDICT_HEAD" --verdict="$VERDICT" \
              --body="$VERDICT_BODY" --session="$VERDICT_SESSION"
            exit 0
          fi
          if [[ "$DRY_RUN" != true && -z "$SHADOW_MIRROR_TOKEN" ]]; then
            echo '::error::Set SHADOW_MIRROR_TOKEN to a PAT with write access to Contents, Pull requests, Actions, and Workflows.'
            exit 1
          fi
          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          for pr in $PRS; do
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid upstream PR number'; exit 1; }
            args+=(--pr "$pr")
          done
          python3 .github/scripts/shadow_mirror/mirror.py sync "${args[@]}"
