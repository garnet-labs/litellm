name: Vendor build backend

on:
  push:
    branches:
      - 'tmp/vendor-build-backend'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download build backend wheels
        run: |
          set -euo pipefail
          python -m pip download --only-binary ':all:' --no-deps --dest out setuptools wheel
          ls -l out
      - name: Upload to the wheelhouse release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload lt-buildinfo-wheels out/setuptools-*.whl out/wheel-*.whl --clobber --repo "$GITHUB_REPOSITORY"
