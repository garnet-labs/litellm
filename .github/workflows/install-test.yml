name: Dependency install and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rb/*-base-*'

concurrency:
  group: install-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  install-test:
    name: Install and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON: '3.12'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-uv-with-retries

      - name: Install dependencies (1)
        run: "uv sync --frozen --group ci --group proxy-dev --extra proxy"
      - name: Install dependencies (2)
        run: "uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma"

      - name: Test
        continue-on-error: true
        run: "uv run --no-sync pytest -q -p no:cacheprovider tests/unit/proxy/db/test_prisma_engine.py tests/unit/proxy/db/test_routing_prisma_wrapper.py"

      - name: Let processes settle
        if: always()
        run: sleep 30
