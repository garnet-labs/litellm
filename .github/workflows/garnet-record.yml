name: Dependency install and test (recorded)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rb/**'

concurrency:
  group: record-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  install-test:
    name: Install and test (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON: '3.12'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries

      - name: Install dependencies (lifecycle scripts execute here)
        run: uv sync --frozen --group ci --extra proxy || uv sync --frozen --extra proxy

      - name: Test
        continue-on-error: true
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/unit/proxy/telemetry

      - name: Boot the proxy and send one request
        continue-on-error: true
        env:
          OPENAI_API_KEY: sk-replay-placeholder
          LITELLM_MASTER_KEY: sk-replay-master-placeholder
        run: |
          uv run --no-sync litellm --model openai/gpt-4o-mini --port 4000  > proxy.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:4000/health/liveliness && break; sleep 2; done
          curl -s localhost:4000/v1/chat/completions -H 'content-type: application/json' -H 'authorization: Bearer sk-replay-master-placeholder' -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"hi"}]}' || true
          sleep 10
          kill %1 || true
          tail -40 proxy.log

      - name: Let sensor settle
        if: always()
        run: sleep 30
