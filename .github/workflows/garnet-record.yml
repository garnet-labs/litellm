name: Garnet Runtime Visibility

on:
  push:
    branches: ['main', 'rb/**']
  pull_request:

permissions: {}

concurrency:
  group: garnet-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  python-install:
    name: Python dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.9'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install frozen Python dependencies with CI extras
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          if 'project' not in project:
              # Poetry-managed revisions install the way the project's own CI does.
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'poetry==2.3.2'])
              command = [sys.executable, '-m', 'poetry', 'install', '--with', 'dev,proxy-dev', '--extras', 'proxy semantic-router']
              print(' '.join(command), flush=True)
              subprocess.check_call(command)
              sys.exit(0)
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          environment = os.environ.copy()
          environment['UV_PYTHON'] = lock['requires-python']
          environment['UV_PYTHON_DOWNLOADS'] = 'automatic'
          print('UV_PYTHON=' + environment['UV_PYTHON'], flush=True)
          wanted = ['google', 'proxy', 'semantic-router', 'saml', 'extra_proxy', 'proxy-runtime', 'utils', 'switchyard']
          defined = project['project'].get('optional-dependencies', {})
          extras = [extra for extra in wanted if extra in defined]
          command = ['uv', 'sync', '--frozen', '--group', 'ci', '--group', 'proxy-dev']
          for extra in extras:
              command.extend(['--extra', extra])
          print(' '.join(command), flush=True)
          subprocess.check_call(command, env=environment)
      - name: Let sensor settle
        if: always()
        run: sleep 30

  dashboard-install:
    name: Dashboard dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install dashboard dependencies
        shell: bash
        run: |
          if [ -f litellm/ui/litellm-dashboard/package-lock.json ]; then
            cd litellm/ui/litellm-dashboard
          elif [ -f ui/litellm-dashboard/package-lock.json ]; then
            cd ui/litellm-dashboard
          else
            echo 'No dashboard package-lock.json found' >&2
            exit 1
          fi
          # Some revisions write the release-age cooldown as "3d", which npm 11 rejects; it reads whole days.
          npm_config_min_release_age=3 npm ci
      - name: Check generated API types
        shell: bash
        run: |
          if [ -f litellm/ui/litellm-dashboard/package-lock.json ]; then
            cd litellm/ui/litellm-dashboard
          elif [ -f ui/litellm-dashboard/package-lock.json ]; then
            cd ui/litellm-dashboard
          else
            echo 'No dashboard package-lock.json found' >&2
            exit 1
          fi
          npm run generate:api-types
          git diff --exit-code -- src/proxy-api.d.ts
      - name: Let sensor settle
        if: always()
        run: sleep 30

  extension-install:
    name: Extension dependency install (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install extension dependencies
        if: hashFiles('vscode-extension/package-lock.json') != ''
        working-directory: vscode-extension
        run: npm ci
      - name: Extension not applicable
        if: hashFiles('vscode-extension/package-lock.json') == ''
        run: echo 'Extension install is not applicable; vscode-extension/package-lock.json is absent.'
      - name: Let sensor settle
        if: always()
        run: sleep 30
