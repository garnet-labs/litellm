# Success-only "record ready" signal for reviewers that start after a CI check.
# Waits until the pull request description carries the Garnet evidence block
# for this head commit in its finalized state (reviewers read the description),
# then exits 0. With no finalized record within 45 minutes it fails, so a
# reviewer that starts after this check never runs without evidence.
# It runs no pull request code and has no sensor.
name: Garnet record ready

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: garnet-record-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record-ready:
    name: Garnet record ready
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Wait for the finalized head-bound evidence block in the description
        shell: bash
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null || true)
            if printf '%s\n' "$pr" | jq -e '(.body // "") | contains("<!-- garnet:record-summary:opt-in -->")' >/dev/null; then
              echo "PR opted into garnet-record-summary; skipping the full-evidence description check."
              exit 0
            fi
            body=$(printf '%s\n' "$pr" | jq -r '.body // ""')
            block=$(printf '%s\n' "$body" | sed -n '/<!-- garnet:evidence:begin -->/,/<!-- garnet:evidence:end -->/p')
            if printf '%s\n' "$block" | grep -F "garnet:commit ${HEAD_SHA}" >/dev/null \
              && printf '%s\n' "$block" | grep -F '"status":"finalized"' >/dev/null; then
              echo "Finalized Garnet evidence for ${HEAD_SHA} is in the description."
              exit 0
            fi
            sleep 15
          done
          echo "No finalized Garnet evidence for ${HEAD_SHA} in the description within 45 minutes."
          exit 1
