# Success-only "record ready" signal for reviewers that start after a CI check.
# It runs no pull request code and has no sensor.
name: Garnet record ready

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: garnet-record-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record-ready:
    name: Garnet record ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fixed short wait
        run: sleep 150

  record-status:
    name: Record status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Publish the same signal as a commit status
        run: |
          sleep 330
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=success -f context='Garnet record ready' -f description='Record ready'